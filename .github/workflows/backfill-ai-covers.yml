name: Backfill AI covers (Z-Image-Turbo)

# One-shot job: for articles with NO original image (body <img> + og:image
# both empty), replace the stock-photo/placeholder cover with an AI-generated
# topical illustration (ModelScope Tongyi-MAI/Z-Image-Turbo).
# Idempotent via crawler-worker/ai_covers_done.json. Trigger manually.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill-ai-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler-worker/requirements.txt

      - name: Run AI-cover backfill
        env:
          STUDIO_BASE_URL: ${{ secrets.STUDIO_BASE_URL }}
          STUDIO_ADMIN_PASSWORD: ${{ secrets.STUDIO_ADMIN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # AI 文生图通道（acct1 token，不占成稿池配额）
          MS_IMAGE_TOKEN: ${{ secrets.MS_IMAGE_TOKEN }}
          IMAGE_GEN_MODEL: "Tongyi-MAI/Z-Image-Turbo"
          IMAGE_GEN_SIZE: "1664x928"
          IMAGE_GEN_MAX_PER_RUN: "25"
        run: |
          cd crawler-worker
          python backfill_ai_covers.py

      - name: Commit image map + done set
        if: always()
        run: |
          git config user.name "crawler-worker[bot]"
          git config user.email "bot@entropygate.cc"
          git remote set-url origin "https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          [ -f crawler-worker/image_map.json ] && git add crawler-worker/image_map.json
          [ -f crawler-worker/ai_covers_done.json ] && git add crawler-worker/ai_covers_done.json
          git diff --cached --quiet || git commit -m "chore: update ai cover state [skip ci]"
          git push
        continue-on-error: true
