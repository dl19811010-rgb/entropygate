name: Backfill AI covers (Z-Image-Turbo)

# One-shot job: for articles with NO original image (body <img> + og:image
# both empty), replace the stock-photo/placeholder cover with an AI-generated
# topical illustration (ModelScope Tongyi-MAI/Z-Image-Turbo).
# Idempotent via crawler-worker/ai_covers_done.json. Trigger manually.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Set to 1 to re-generate even done items (in-place R2 overwrite)"
        required: false
        default: "0"
      only_ids:
        description: "Comma-separated article ids to process only (e.g. 239,244). Implies force."
        required: false
        default: ""
      max_per_run:
        description: "Max NEW generations this run"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  backfill-ai-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler-worker/requirements.txt

      - name: Run AI-cover backfill
        env:
          STUDIO_BASE_URL: ${{ secrets.STUDIO_BASE_URL }}
          STUDIO_ADMIN_PASSWORD: ${{ secrets.STUDIO_ADMIN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # AI 文生图通道（token 不占成稿池配额）
          # v2 配方（2026-07-25）：provider 注册表 + 视觉导演 brief + 统一后处理。
          # 换模型改 IMAGE_GEN_PROVIDER（zimage_turbo/zimage/qwen_image）；
          # 翻新存量设 AI_COVERS_FORCE: "1"（确定性 key 原地覆盖，URL 不变）。
          MS_IMAGE_TOKEN: ${{ secrets.MS_IMAGE_TOKEN }}
          IMAGE_GEN_PROVIDER: "zimage_turbo"
          IMAGE_GEN_MAX_PER_RUN: ${{ inputs.max_per_run || '25' }}
          COVER_POSTPROCESS: "1"
          # 有字版封面（YouTube 风格 headline 叠字）；退纯底图设 "0"
          COVER_TEXT_OVERLAY: "1"
          # 定点重生成：only_ids 非空时隐含 force，只处理指定 id（小批量试新配方用）
          AI_COVERS_FORCE: ${{ inputs.force || '0' }}
          AI_COVERS_ONLY_IDS: ${{ inputs.only_ids || '' }}
        run: |
          cd crawler-worker
          python backfill_ai_covers.py

      - name: Commit image map + done set
        if: always()
        run: |
          git config user.name "crawler-worker[bot]"
          git config user.email "bot@entropygate.cc"
          git remote set-url origin "https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          [ -f crawler-worker/image_map.json ] && git add crawler-worker/image_map.json
          [ -f crawler-worker/ai_covers_done.json ] && git add crawler-worker/ai_covers_done.json
          git diff --cached --quiet || git commit -m "chore: update ai cover state [skip ci]"
          git push
        continue-on-error: true
